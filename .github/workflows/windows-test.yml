name: Windows Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check extension
        run: npx tsc -p . --noEmit

      - name: Type-check tests
        run: npx tsc -p test/tsconfig.json

      - name: Run Proposed API tests
        shell: pwsh
        run: |
          $env:NO_COLOR = '1'
          & npx vitest run `
            test/unit/proposed-api.test.ts `
            test/unit/proposed-api-product-write.test.ts `
            --reporter=default `
            --reporter=github-actions *> vitest-output.txt
          $exitCode = $LASTEXITCODE
          Get-Content vitest-output.txt
          if ($exitCode -ne 0) {
            $details = (Get-Content vitest-output.txt -Tail 100) -join "`n"
            $details = $details -replace '(-EncodedCommand )[A-Za-z0-9+/=]+', '$1[omitted]'
            $escaped = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows Proposed API tests failed::$escaped"
            exit $exitCode
          }

      - name: Compile extension TypeScript
        run: npx tsc -p .
