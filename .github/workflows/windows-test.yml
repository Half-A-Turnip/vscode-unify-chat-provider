name: Windows Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check extension
        run: npx tsc -p . --noEmit

      - name: Type-check tests
        run: npx tsc -p test/tsconfig.json

      - name: Build chat-lib runtime
        run: npm run build:chat-lib-runtime

      - name: Run unit tests
        run: npx vitest run --reporter=default --reporter=github-actions

      - name: Build extension
        run: npm run compile
